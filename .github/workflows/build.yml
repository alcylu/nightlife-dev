name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run audit:security
      - run: npm test
      - run: npm run build
      - run: npm run test:build
